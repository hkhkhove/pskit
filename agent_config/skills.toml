[[skills]]
id = "sequence_interaction_prediction"
name = "Sequence Interaction Prediction"
description = "Predict interaction from protein and nucleic sequences."
when_to_use = "User provides sequences without structure and asks interaction likelihood/classification."
workflow = [
    "Use predict_interaction(protein_sequence, nucleic_sequence).",
    "Use read_result_file to read the whole result file and summarize key predicted interaction likelihood or classification for user interpretation.",
]
allowed_tools = ["predict_interaction"]
stop_when = ""

[[skills]]
id = "combination_skills"
name = "Combination skills"
description = """
Combination of multiple tools for complex tasks.
For example: user asks for splitting a complex and then annotating binding pairs or predicting binding sites on a specific chain.\
In this case, the agent should be able to combine tools like split_complex or split_pdb_by_chain with annotate_binding_pairs or predict_binding_sites in a logical workflow to achieve the user's goal.
"""
when_to_use = "When user requests a complex task that involves multiple steps or tools, such as splitting a structure and then performing analysis on the split components."
workflow = [
    "Identify the multiple steps/tools needed to fulfill the user's request.",
    "Use the appropriate tools in a logical sequence to achieve the desired outcome.",
    "Summarize the results and guide the user through the combined workflow.",
]
allowed_tools = [
    "search_pdb",
    "fetch_pdb_info",
    "download_pdb_file",
    "split_complex",
    "split_pdb_by_chain",
    "annotate_binding_pairs",
    "calculate_contact_map",
    "predict_binding_sites",
    "extract_empirical_features",
    "predict_interaction",
    "read_result_file",
]
stop_when = ""

