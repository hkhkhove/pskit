[[skills]]
id = "pdb_discovery"
name = "PDB Discovery"
description = """
Find relevant PDB entries from natural language.\
Fetch PDB infomation only when the user wants specific informations of certain entries.\
Don't chose this skill if the user wants to do further analysis in addition to retrieving information, such as nucleic acid binding pair annotation\
"""
when_to_use = "When a user requests to query some proteins or other biomolecules or chemical molecules"
workflow = [
    "Use search_pdb(query) to find candidate IDs.",
    "Use fetch_pdb_info(pdb_id) if necessary.",
]
allowed_tools = ["search_pdb", "fetch_pdb_info"]
stop_when = ""

[[skills]]
id = "structure_splitting"
name = "Structure Splitting"
description = "Inspect entry metadata and split complex/chains for downstream analysis readiness."
when_to_use = "User asks to inspect composition, chains, or preprocessing steps."
workflow = [
    "Use fetch_pdb_info(pdb_id) for metadata.",
    "Use split_complex or split_pdb_by_chain on downloaded/local structure.",
    "Summarize resulting files and recommended analysis entry points.",
]
allowed_tools = [
    "fetch_pdb_info",
    "download_pdb_file",
    "split_complex",
    "split_pdb_by_chain",
]
stop_when = ""

[[skills]]
id = "binding_pair_annotation"
name = "Protein Nucleic Acid Binding Pair Annotation"
description = "Annotate protein-nucleic-acid contact residue pairs."
when_to_use = "User asks for binding pair annotation or contact residues on a specific structure."
workflow = [
    "Use search_pdb to find candidate IDs if user only provides natural language description and not PDB IDs.",
    "Use fetch_pdb_info if user not provide PDB IDs and ask for specific information on entries. Otherwise, do not fetch unnecessary metadata.",
    "Use download_pdb_file for user-provided PDB IDs or candidate IDs from search_pdb. If the required protein structure has already been downloaded in the historical dialog, do not download it again.",
    "Use annotate_binding_pairs with pdb_path and cutoff.",
    "Use read_result_file to read the whole result file and summarize key pair statistics and their distances for user interpretation.",
]
allowed_tools = [
    "search_pdb",
    "fetch_pdb_info",
    "download_pdb_file",
    "annotate_binding_pairs",
    "read_result_file",
]
stop_when = ""

[[skills]]
id = "fragment_extraction"
name = "Chain Fragment Extraction"
description = "Extract specific chain/region for focused analysis."
when_to_use = "User asks to isolate chain fragments or residue ranges."
workflow = [
    "Use search_pdb to find candidate IDs if user only provides natural language description and not PDB IDs.",
    "Use fetch_pdb_info if user not provide PDB IDs and ask for specific information on entries. Otherwise, do not fetch unnecessary metadata.",
    "Use download_pdb_file for user-provided PDB IDs or candidate IDs from search_pdb. If the required protein structure has already been downloaded in the historical dialog, do not download it again.",
    "Use extract_fragment(pdb_path, chain, start, end).",
    "Return fragment file path and suggested next analysis.",
]
allowed_tools = [
    "search_pdb",
    "fetch_pdb_info",
    "download_pdb_file",
    "extract_fragment",
]
stop_when = ""

[[skills]]
id = "contact_map_analysis"
name = "Contact Map Analysis"
description = "Compute structural contact map for chain or full structure."
when_to_use = "User asks for contact maps, residue contact topology, or graph-ready structure maps."
workflow = [
    "Use download_pdb_file for provided PDB ID. If the required protein structure has already been downloaded in the historical dialog, it does not need to be re-downloaded",
    "Use calculate_contact_map with mode and optional chain.",
    "Use read_result_file to read the whole result file and summarize key contact map features and their interpretation for user.",
]
allowed_tools = [
    "download_pdb_file",
    "calculate_contact_map",
    "read_result_file",
]
stop_when = ""

[[skills]]
id = "binding_site_prediction"
name = "Binding Site Prediction"
description = "Predict DNA/RNA binding sites for protein structure."
when_to_use = "User asks for binding site prediction rather than deterministic contact annotation."
workflow = [
    "Use download_pdb_file for provided PDB ID. If the required protein structure has already been downloaded in the historical dialog, it does not need to be re-downloaded",
    "Use predict_binding_sites(pdb_path, ligand_type).",
    "use read_result_file to read the whole result file and summarize key predicted binding sites and their scores for user interpretation.",
]
allowed_tools = [
    "predict_binding_sites",
    "download_pdb_file",
    "read_result_file",
]
stop_when = ""

[[skills]]
id = "feature_extraction_pipeline"
name = "Feature Extraction Pipeline"
description = "Extract  features for downstream modeling."
when_to_use = "User asks for feature extraction, model-ready descriptors, or comparative feature sets."
workflow = [
    "Use download_pdb_file for provided PDB ID. If the required protein structure has already been downloaded in the historical dialog, it does not need to be re-downloaded",
    "Use extract_empirical_features.",
    "Use read_result_file to read the whole result file and summarize key features for user interpretation.",
]
allowed_tools = [
    "download_pdb_file",
